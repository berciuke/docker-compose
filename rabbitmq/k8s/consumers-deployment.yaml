apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortgage-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mortgage-consumer
  template:
    metadata:
      labels:
        app: mortgage-consumer
    spec:
      containers:
      - name: mortgage-consumer
        image: rabbitmq-consumers:latest
        imagePullPolicy: Never
        command: ["python", "mortgage_consumer.py"]
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq"
